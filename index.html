<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba Visualizacion PMTiles</title>

  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { height: 100vh; width: 100%; }


    
    .info-box-small {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
      font-size: 12px;
      color: #333;
      white-space: nowrap;
    }
    .info-box-small a {
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
      margin-left: 4px;
    }
    .info-box-small a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div id="map"></div>
  <div class="info-box-small">
      For more info refer to the repository in <a href="https://github.com/mibracan1/housing_pressure_-Sp-" target="_blank" rel="noopener">GitHub</a>. Thank you! 
    </div>
  </div>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: 'map',
      zoom: 6,
      center: [-3.7038, 40.4168],
      style: {
        version: 8,
        sources: {
          'base-esri': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Tiles &copy; Esri &mdash; &copy; OpenStreetMap contributors'
          },
          'capa-vivienda': {
            type: 'vector',
            url: 'pmtiles://output_housing_v3.pmtiles',
            attribution: '| Fuente: &copy; Miguel Bravo Candela'
          }
        },
        layers: [
          {
            id: 'mapa-base',
            type: 'raster',
            source: 'base-esri'
          },
          {
            id: 'vivienda-poligonos',
            type: 'fill',
            source: 'capa-vivienda',
            'source-layer': 'gdf_df_24_spain_perfect', 
            filter: [
              'all',
              ['has', 'indice_mult_log'],
              ['!=', ['get', 'indice_mult_log'], null],
              ['>', ['get', 'indice_mult_log'], 0]
            ],
            paint: {
              'fill-color': [
                'interpolate',
                ['linear'],
                ['coalesce', ['get', 'indice_mult_log']],
                  0,    '#cccccc',      
                  0.1, '#BAF4FD',      
                  0.13, '#FDBABA',      
                  0.17, '#F83535', 
                  0.25,  '#9D0606',   
                  0.526314, '#450202'       
                ],
                'fill-opacity': 0.6
              }
},
          {
            id: 'vivienda-lineas',
            type: 'line',
            source: 'capa-vivienda',
            'source-layer': 'gdf_df_24_spain_perfect',
            paint: {
              'line-color': '#ffffff',
              'line-width': 0.1
            }
          }
        ]
      }
    });

  
    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false
    });

    
    map.on('mousemove', 'vivienda-poligonos', (e) => {
      map.getCanvas().style.cursor = 'pointer';

      if (e.features.length > 0) {
        const val = e.features[0].properties.indice_mult_log;
        const formattedVal = val !== undefined ? Number(val).toFixed(2) : 'N/A';

        popup
          .setLngLat(e.lngLat)
          .setHTML(`<strong>Rent Pressure Index:</strong> ${formattedVal}`)
          .addTo(map);
      }
    });

    
    map.on('mouseleave', 'vivienda-poligonos', () => {
      map.getCanvas().style.cursor = '';
      popup.remove();
    });

  </script>
</body>
</html>
